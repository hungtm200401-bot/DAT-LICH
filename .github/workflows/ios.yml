name: HOAN Admin iPhone

on:
  workflow_dispatch:
    inputs:
      admin_origin:
        description: HTTPS origin of the admin server
        required: false
        type: string
  push:
    paths:
      - ios/**
      - .github/workflows/ios.yml

permissions:
  contents: read

concurrency:
  group: hoan-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build IPA
        env:
          HOAN_ADMIN_ORIGIN: ${{ inputs.admin_origin }}
        run: bash ios/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HOAN-Admin-iPhone
          path: IPA/*.ipa
          if-no-files-found: error

  simulator:
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [compact, large]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare local test server
        run: |
          npm ci --include=dev
          npm run db:migrate:local

      - name: Check iPhone layout
        env:
          HOAN_SIMULATOR_PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p outputs/hoan-admin-app/ios
          HOAN_IOS_TEST_ADMIN_KEY="$(node -p "require('node:crypto').randomBytes(24).toString('hex')")"
          export HOAN_IOS_TEST_ADMIN_KEY
          printf 'ADMIN_TOKEN=%s\n' "$HOAN_IOS_TEST_ADMIN_KEY" > .dev.vars
          HOAN_IOS_TEST_WORK_REMINDER="$(node -p 'Math.floor((Date.now() + 86400000) / 60000) * 60000')"
          export HOAN_IOS_TEST_WORK_REMINDER
          read -r appointment_date appointment_time < <(node -e 'const local = new Date(Number(process.env.HOAN_IOS_TEST_WORK_REMINDER) + 86400000 + 7 * 3600000).toISOString(); console.log(local.slice(0,10), local.slice(11,16));')
          node node_modules/wrangler/bin/wrangler.js d1 execute site-creator-d1 --config wrangler.local.json --local --command \
            "INSERT INTO appointments (code, customer, phone, service_id, date, time, total, status) VALUES ('HMA-CI-REMINDER', 'Lịch kiểm tra', '0900000000', 'personal', '${appointment_date}', '${appointment_time}', 450000, 'confirmed');"
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort > outputs/hoan-admin-app/ios/test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            status=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/admin-session || true)
            if [[ "$status" == 401 ]]; then break; fi
            sleep 1
          done
          if [[ "$status" != 401 ]]; then
            tail -n 50 outputs/hoan-admin-app/ios/test-server.log
            exit 1
          fi
          if ! curl -fsS --max-time 90 -o /dev/null http://127.0.0.1:5173/; then
            tail -n 50 outputs/hoan-admin-app/ios/test-server.log
            exit 1
          fi
          bash ios/check-simulator.sh outputs/hoan-admin-app/ios/simulator "$HOAN_SIMULATOR_PROFILE"

      - name: Upload Simulator results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iPhone-Simulator-${{ matrix.profile }}
          path: |
            outputs/hoan-admin-app/ios/simulator/
            outputs/hoan-admin-app/ios/test-server.log
          if-no-files-found: ignore
